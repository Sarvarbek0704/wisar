name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wisar
          POSTGRES_PASSWORD: wisar
          POSTGRES_DB: wisar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wisar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://wisar:wisar@localhost:5432/wisar?schema=public"
      JWT_SECRET: "ci-test-secret-at-least-32-characters-long-string"
      NEXT_PUBLIC_API_URL: "http://localhost:4000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema packages/database/prisma/schema.prisma

      - name: Sync database schema
        run: npx prisma db push --schema packages/database/prisma/schema.prisma --skip-generate

      - name: Typecheck (api)
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Typecheck (web)
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
