<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162447"/>
      <stop offset="100%" stop-color="#0B111D"/>
    </linearGradient>
    <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="38" fill="url(#bg)"/>
  <rect width="200" height="200" rx="38" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <!-- W (blue, main) -->
  <path d="M22 62 L52 150 L100 86 L148 150 L178 62"
        fill="none" stroke="url(#wg)" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- S (silver, overlaid on W center-top) -->
  <path d="M 116,42
           C 116,30 100,24 84,30
           C 68,36 74,50 90,54
           C 106,58 118,66 112,80
           C 106,92 84,90 76,80"
        fill="none" stroke="url(#sg)" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
