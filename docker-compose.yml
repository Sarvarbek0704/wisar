services:
  db:
    image: postgres:16-alpine
    container_name: wisar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wisar
      POSTGRES_PASSWORD: wisar
      POSTGRES_DB: wisar
    ports:
      - "5432:5432"
    volumes:
      - wisar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisar"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ixtiyoriy: brauzerda DB ko'rish uchun (http://localhost:8080)
  adminer:
    image: adminer:latest
    container_name: wisar-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  wisar-pgdata:
