services:
  db:
    image: postgres:16-alpine
    container_name: mana-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mana
      POSTGRES_PASSWORD: mana
      POSTGRES_DB: mana
    ports:
      - "5432:5432"
    volumes:
      - mana-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mana"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ixtiyoriy: brauzerda DB ko'rish uchun (http://localhost:8080)
  adminer:
    image: adminer:latest
    container_name: mana-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mana-pgdata:
